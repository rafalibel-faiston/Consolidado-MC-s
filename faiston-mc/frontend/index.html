<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC · Faiston Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f4f8; --panel:#fff; --side:#fff; --line:#ececf3; --line-2:#e2e2ec;
  --tx:#1b1830; --tx-2:#4a4763; --mut:#8b8a9e; --mut-2:#a9a8ba;
  --vio:#7c3aed; --vio-2:#a855f7; --vio-soft:#f3edff; --vio-line:#e4d8ff;
  --mag:#d946ef; --cy:#22d3ee; --deep:#4c1d95;
  --grad:linear-gradient(135deg,#7c3aed 0%,#a855f7 55%,#d946ef 100%);
  --grad-side:linear-gradient(135deg,#6d28d9 0%,#8b5cf6 100%);
  --ok:#10b981; --warn:#f59e0b; --logo-tx:#3A3A3A;
  --shadow:0 1px 2px rgba(27,24,48,.05),0 4px 14px rgba(27,24,48,.05);
  --shadow-lg:0 8px 30px rgba(124,58,237,.14);
  --r:14px;
}
html[data-theme=dark]{
  --bg:#12111c; --panel:#1a1827; --side:#171522; --line:#272437; --line-2:#302c44;
  --tx:#f2f1f7; --tx-2:#c9c6dc; --mut:#8b88a3; --mut-2:#6d6a85;
  --vio-soft:#241d3d; --vio-line:#3a2f60; --logo-tx:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 8px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1{font-size:23px;font-weight:700;letter-spacing:-.5px}
h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
h3{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px}
.flogo path[fill]{fill:var(--logo-tx)}

/* ================= HEADER ================= */
.hdr{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  padding:0 28px;height:62px;display:flex;align-items:center;gap:16px}
.hdr .flogo{width:104px;height:auto;flex-shrink:0}
.hdr .ops{font-size:10px;font-weight:700;letter-spacing:1.3px;color:var(--vio);
  background:var(--vio-soft);border:1px solid var(--vio-line);padding:3px 7px;border-radius:6px}
.hdr .div{width:1px;height:24px;background:var(--line-2)}
.hdr .pg{font-size:13.5px;font-weight:600;color:var(--tx-2);display:flex;align-items:center;gap:8px}
.hdr .pg svg{width:16px;height:16px;color:var(--vio)}
.hdr .acts{margin-left:auto;display:flex;align-items:center;gap:9px}

/* ================= TOPBAR ================= */
.wrap{max-width:1560px;margin:0 auto;display:flex;flex-direction:column}
.top{background:var(--bg);padding:22px 28px 0;display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.top .ttl h1{margin-bottom:3px}
.top .ttl p{color:var(--mut);font-size:13px}
.top .acts{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search{position:relative}
.search input{width:210px;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--panel);color:var(--tx);font-family:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--vio);box-shadow:0 0 0 3px var(--vio-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut)}
.icobtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);
  color:var(--tx-2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.icobtn:hover{border-color:var(--vio);color:var(--vio)}
.icobtn svg{width:16px;height:16px}
.btn{background:var(--grad);color:#fff;border:none;padding:10px 17px;border-radius:10px;font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 4px 14px rgba(124,58,237,.28);white-space:nowrap}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn.ghost{background:var(--panel);color:var(--tx-2);border:1px solid var(--line-2);box-shadow:none;font-weight:500}
.btn.ghost:hover{border-color:var(--vio);color:var(--vio);transform:none;filter:none}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.danger{background:var(--panel);border:1px solid #fecdd3;color:#e11d48;box-shadow:none;font-weight:500}
html[data-theme=dark] .btn.danger{border-color:#4a1d2b}

main{padding:20px 28px 60px;flex:1}

/* ================= CARDS ================= */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:18px 20px 0}
.card-h h3{margin-bottom:3px}
.card-h p{color:var(--mut);font-size:12.5px}
.card-b{padding:16px 20px 20px}
.card-b.flush{padding:8px 6px 6px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0}
.kpi.hi::after{opacity:1}
.kpi .r1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--vio-soft);color:var(--vio);display:grid;place-items:center}
.kpi .ic svg{width:17px;height:17px}
.kpi.c2 .ic{background:#e0f7fb;color:#0891b2}
.kpi.c3 .ic{background:#fdeafd;color:#c026d3}
html[data-theme=dark] .kpi.c2 .ic{background:#12333a;color:#38d6ec}
html[data-theme=dark] .kpi.c3 .ic{background:#3a1440;color:#e879f9}
.pill{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--vio-soft);
  color:var(--vio);white-space:nowrap;border:1px solid var(--vio-line)}
.pill.g{background:#e7f8f1;color:#059669;border-color:#c7efdf}
.pill.y{background:#fef4e2;color:#b45309;border-color:#fae4bd}
.pill.n{background:var(--bg);color:var(--mut);border-color:var(--line-2)}
html[data-theme=dark] .pill.g{background:#0d2f24;border-color:#174736}
html[data-theme=dark] .pill.y{background:#3a2a0c;border-color:#54401a}
.kpi .lbl{font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.kpi .val{font-size:29px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;font-family:'Inter'}
.kpi .val u{text-decoration:none;font-size:15px;font-weight:600;color:var(--mut);margin-left:2px}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:6px}

/* tabs */
.tabbar{display:inline-flex;gap:3px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow);flex-wrap:wrap}
.tabbar .t{padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mut);
  cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.tabbar .t:hover{color:var(--tx)}
.tabbar .t.on{background:var(--vio-soft);color:var(--vio);font-weight:600}
.tabbar .t svg{width:14px;height:14px}


/* ================= CAIXINHAS ================= */
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:13px}
.cx{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;
  padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.16s;position:relative}
.cx:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--c)}
.cx.off{opacity:.45}
.cx.nao{border-left-color:#94a3b8;border-style:dashed}
.cx-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.cx-n{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-p{font-size:12.5px;font-weight:700;color:var(--c);flex-shrink:0}
.cx-v{font-size:21px;font-weight:700;letter-spacing:-.8px;margin-bottom:9px}
.cx-s{font-size:11px;color:var(--mut-2);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx:hover .cx-s{color:var(--c)}

/* etiqueta de aba de origem */
.aba{display:inline-block;padding:3px 9px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--bg);font-size:11px;font-weight:600;color:var(--tx-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* tabela larga do gerencial */
table.wide{font-size:12.5px;min-width:2400px}
table.wide td,table.wide th{padding:9px 10px}
/* ID nunca quebra e fica fixo na rolagem horizontal */
td.mono{white-space:nowrap}
table.wide th:first-child,table.wide td:first-child{white-space:nowrap;position:sticky;left:0;z-index:3;
  background:var(--panel);box-shadow:1px 0 0 var(--line)}
table.wide thead th:first-child{z-index:4;background:var(--panel)}
table.wide tfoot td:first-child{background:var(--bg)}
table.wide tbody tr.clickable:hover td:first-child{background:var(--vio-soft)}
th.cx{cursor:pointer}
th.cx:hover span{filter:brightness(1.2)}
td.nao-map{background:rgba(148,163,184,.13);font-weight:600}

/* seg control (mini tabs dentro do card) */
.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg .s{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg .s.on{background:var(--vio);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(124,58,237,.3)}

/* filtros */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line-2);color:var(--tx);
  padding:9px 12px;border-radius:10px;font-family:inherit;font-size:13px;outline:none;transition:.15s}
select:focus,input:focus{border-color:var(--vio);box-shadow:0 0 0 3px var(--vio-soft)}
input[type=number]{width:92px;text-align:right}
.chip{padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);
  color:var(--mut);font-size:12.5px;font-weight:500;cursor:pointer;transition:.15s;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:3px;background:currentColor;opacity:.35}
.chip:hover{border-color:var(--vio);color:var(--tx)}
.chip.on{background:var(--vio-soft);border-color:var(--vio-line);color:var(--vio);font-weight:600}
.chip.on .dot{opacity:1}
.chip.on.p1{color:#7c3aed}.chip.on.p2{color:#0891b2}.chip.on.p3{color:#4c1d95}.chip.on.p4{color:#c026d3}
html[data-theme=dark] .chip.on.p2{color:#38d6ec}
html[data-theme=dark] .chip.on.p3{color:#a78bfa}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--mut);padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--vio)}
th.num,td.num{text-align:right}
td{padding:12px 13px;border-bottom:1px solid var(--line);color:var(--tx-2)}
td b{color:var(--tx);font-weight:600}
tbody tr.clickable{cursor:pointer;transition:.12s}
tbody tr.clickable:hover{background:var(--vio-soft)}
tbody tr:last-child td{border-bottom:none}
tfoot td{padding:13px;font-weight:600;color:var(--tx);border-top:1px solid var(--line-2);border-bottom:none;background:var(--bg)}
.tbl-wrap{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums}
.zero{color:var(--mut-2)}
.muted{color:var(--mut)}

/* badges / barras */
.badge{display:inline-block;padding:3.5px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.ok{background:#e7f8f1;color:#059669}
.badge.warn{background:#fef4e2;color:#b45309}
.badge.neutral{background:var(--bg);color:var(--mut)}
html[data-theme=dark] .badge.ok{background:#0d2f24}
html[data-theme=dark] .badge.warn{background:#3a2a0c}
.bar-track{height:8px;background:var(--bg);border-radius:5px;overflow:hidden;min-width:70px;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:5px;background:var(--grad)}
.rank-row{display:grid;grid-template-columns:1fr 120px 74px;gap:12px;align-items:center;padding:11px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:.12s}
.rank-row:hover{background:var(--vio-soft)}
.rank-row:last-child{border-bottom:none}
.rank-row .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .nm small{color:var(--mut);display:block;font-size:11.5px;font-weight:400;margin-top:2px}
.rank-row .pc{text-align:right;font-weight:700;font-size:14.5px;letter-spacing:-.4px}
.chart-box{position:relative;height:280px}
.hide{display:none!important}

/* dropzone */
#drop{border:2px dashed var(--line-2);border-radius:18px;padding:56px 24px;text-align:center;
  transition:.18s;cursor:pointer;background:var(--panel)}
#drop.over{border-color:var(--vio);background:var(--vio-soft)}
#drop .ic{width:58px;height:58px;border-radius:16px;background:var(--grad);display:grid;place-items:center;
  margin:0 auto 18px;box-shadow:var(--shadow-lg)}
#drop .ic svg{width:26px;height:26px;color:#fff}
#drop .big{font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
#drop .sm{color:var(--mut);font-size:13px}

.err{background:#fff1f2;border:1px solid #fecdd3;color:#be123c;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:14px}
.ok-box{background:#ecfdf5;border:1px solid #c7efdf;color:#047857;padding:12px 16px;border-radius:12px;font-size:13px}
html[data-theme=dark] .err{background:#2c1119;border-color:#4a1d2b;color:#fb7185}
html[data-theme=dark] .ok-box{background:#0d2f24;border-color:#174736;color:#34d399}

/* DRE */
.dre{display:flex;flex-direction:column;gap:2px}
.dre-l{display:grid;grid-template-columns:24px 1fr 148px 86px;gap:12px;align-items:center;padding:11px 13px;border-radius:10px;font-size:13.5px}
.dre-l.head{background:var(--bg);font-weight:600}
.dre-l.minus{color:#be123c}
html[data-theme=dark] .dre-l.minus{color:#fb7185}
.dre-l.result{background:var(--vio-soft);border:1px solid var(--vio-line);font-weight:700;margin:5px 0;color:var(--vio)}
.dre-l.result2{background:#fdeafd;border:1px solid #f7d0f9;font-weight:700;margin:5px 0;color:#c026d3}
html[data-theme=dark] .dre-l.result{color:#c4a8ff}
html[data-theme=dark] .dre-l.result2{background:#3a1440;border-color:#5b1f63;color:#e879f9}
.dre-l .sig{text-align:center;color:var(--mut)}
.dre-l .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dre-l .pcv{text-align:right;color:var(--mut);font-size:12px}
.dre-sub{padding-left:49px;font-size:12.5px;color:var(--mut);display:grid;grid-template-columns:1fr 148px 86px;gap:12px;padding-top:4px;padding-bottom:4px}
.dre-sub .vl{text-align:right;font-variant-numeric:tabular-nums}
.dre-sub .pcv{text-align:right}

/* pilares */
.pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
.pilar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}
.pilar .tp{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.pilar .nm{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilar .pc{font-weight:700;font-size:13px;color:var(--c);flex-shrink:0}
.pilar .vl{font-weight:700;font-size:20px;letter-spacing:-.7px;margin-bottom:9px}
.p1{--c:#7c3aed}.p2{--c:#0891b2}.p3{--c:#4c1d95}.p4{--c:#c026d3}
.pilar .bar-fill{background:var(--c)}

/* detalhe */
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.dtab{padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--mut);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.dtab:hover{color:var(--tx)}
.dtab.on{color:var(--vio);border-bottom-color:var(--vio);font-weight:600}
.dtab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}

/* simulador */
input.simin{width:86px;background:var(--vio-soft);border:1px solid var(--vio-line);color:var(--tx);font-weight:600}
input.simin.dirty{background:#fdeafd;border-color:#e9a8ef}
html[data-theme=dark] input.simin.dirty{background:#3a1440;border-color:#5b1f63}
.delta-up{color:#059669;font-weight:600}
.delta-dn{color:#e11d48;font-weight:600}
html[data-theme=dark] .delta-up{color:#34d399}
html[data-theme=dark] .delta-dn{color:#fb7185}
.sim-note{font-size:12.5px;color:var(--mut);margin-bottom:16px;line-height:1.6}

.sect{margin-top:22px}
.sect-h{display:flex;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.sect-h h2{letter-spacing:-.3px}
.sect-h .sp{flex:1}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:1080px){.g2{grid-template-columns:1fr}}
@media(max-width:900px){
  main{padding:16px 14px 50px}.top{padding:16px 14px 0}
  .dre-l{grid-template-columns:20px 1fr 108px}.dre-l .pcv{display:none}
  .dre-sub{grid-template-columns:1fr 108px}.dre-sub .pcv{display:none}
  .search input{width:150px}
}
</style>
</head>

<header class="hdr">

<script>
/* ============================================================
   Painel de MC — Faiston
   Leitura local do modelo oficial de Memória de Cálculo.
   Nenhum dado sai do navegador.
   ============================================================ */

/* ---------- utils ---------- */
const N = s => (s==null?'':String(s)).trim().toUpperCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');

function num(v){
  if (v==null || v==='') return 0;
  if (typeof v === 'number') return isFinite(v)?v:0;
  let s = String(v).replace(/[R$\s%]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isFinite(n)?n:0;
}
const money = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const money0 = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const pct = v => (v==null||!isFinite(v)) ? '—' : (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const pct2 = v => (v==null||!isFinite(v)) ? '—' : (v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const qty = v => (v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = id => document.getElementById(id);

const PILARES = [
  {k:'equipe',  n:'Equipe Faiston',        sheet:'2.1', cls:'p1', color:'#7c3aed'},
  {k:'campo',   n:'Suporte de Campo',      sheet:'2.2', cls:'p2', color:'#22d3ee'},
  {k:'log',     n:'Equipamentos/Logística',sheet:'2.3', cls:'p3', color:'#4c1d95'},
  {k:'invest',  n:'Investimentos',         sheet:'2.4', cls:'p4', color:'#d946ef'}
];

/* ============================================================
   O parsing das planilhas (xlsx/xlsb/xlsm) roda no backend —
   veja faiston-mc/app/parser.py. O que fica aqui é só o que a UI
   ainda usa no navegador direto: custo de linha e o simulador.
   ============================================================ */
/* custo da linha = qtde × valor unitário × meses (quando o bloco tem coluna de meses) */
const lineCost = r => r.qtd * r.unit * (r.hm ? r.meses : 1);

/* núcleo do cálculo — mesma lógica do 5.DRE da planilha, usado pelo simulador */
function calcDRE(receita, somas, impostoFator, rateios){
  const impostos = receita * impostoFator;
  const receitaLiq = receita - impostos;
  const custo = PILARES.reduce((a,p)=>a+(somas[p.k]||0),0);
  const mcProjeto = receitaLiq - custo;
  const rateioVals = rateios.map(r=>({nome:r.nome, valor:receitaLiq*r.p, p:r.p}));
  const rateioTot = rateioVals.reduce((a,r)=>a+r.valor,0);
  const mcDireta = mcProjeto - rateioTot;
  return {
    receita, impostos, receitaLiq, custo, mcProjeto, mcDireta,
    mcProjetoPct: receitaLiq ? mcProjeto/receitaLiq : null,
    mcDiretaPct:  receitaLiq ? mcDireta/receitaLiq  : null,
    rateioVals, rateioTot
  };
}

   ============================================================ */
const CAIXAS = [
  {k:'n1',       n:'N1',              col:'N1',                 pil:'equipe'},
  {k:'n2',       n:'N2',              col:'N2',                 pil:'equipe'},
  {k:'campo',    n:'Tec campo',       col:'Tec campo',          pil:'campo'},
  {k:'logpecas', n:'Logística de peças',col:'Logistica de peças',pil:'log'},
  {k:'molog',    n:'M.O. Logística',  col:'M.O. Logistica',     pil:'equipe'},
  {k:'armaz',    n:'Armazenagem',     col:'Armazenagem',        pil:'log'},
  {k:'reparo',   n:'Reparos peças',   col:'Reparos peças',      pil:'log'},
  {k:'spare',    n:'Invest. Spare',   col:'Invest. Spare',      pil:'invest'},
  {k:'locacao',  n:'Locação',         col:'Locação',            pil:'invest'},
  {k:'sdm',      n:'SDM',             col:'SDM2',               pil:'equipe'},
  {k:'sistema',  n:'Sistema',         col:'SISTEMA',            pil:'invest'},
  {k:'tel',      n:'Telefonia',       col:'TELEFONIA',          pil:'invest'},
  {k:'adm',      n:'ADM (MO-AL-FC)',  col:'ADM(MO - AL - FC )', pil:'equipe'},
  {k:'gp',       n:'GP',              col:'GP',                 pil:'equipe'},
  {k:'nao',      n:'Não mapeado',     col:'—',                  pil:'*'}
];
const CAIXA_BY_K = Object.fromEntries(CAIXAS.map(c=>[c.k,c]));

const RX_TEL = /(TELEFON|VOZ|PABX|CELULAR|LINK DE|OMNIPBX|CALL CENTER|E1\b|RAMAL)/;
const RX_LOC = /(LOCACAO|ALUGUEL|LOCAC|ESPACO COMERCIAL|COMODATO)/;

/* devolve a caixinha de uma linha; usar sempre com o pilar de origem */
function classificar(pilarK, r){
  const t = N([r.g1, r.cat, r.desc].filter(Boolean).join(' '));
  if(pilarK === 'campo') return 'campo';

  if(pilarK === 'equipe'){
    if(/\bN1\b/.test(t) || /SERVICE DESK|HELP ?DESK/.test(t))       return 'n1';
    if(/\bN2\b/.test(t))                                            return 'n2';
    if(/\bSDM\b|SERVICE DELIVERY/.test(t))                          return 'sdm';
    if(/LOGISTIC/.test(t))                                           return 'molog';
    if(/\bGP\b|GEREN(TE|CIA) DE PROJET|ANALISTA DE PROJETOS|COORDENADOR DE PROJETO/.test(t)) return 'gp';
    if(/BACKOFFICE|BACK OFFICE|ADMINISTRAT|FACILIT|FINANCEIR|LIDER|TICKET MANAGER|COORDENADOR/.test(t)) return 'adm';
    if(/SUPORTE|INFRAESTRUT|TECNIC|CAMPO|REDES|SEGURANC/.test(t))     return 'n2';
    return 'nao';
  }
  if(pilarK === 'log'){
    if(/ARMAZENAG|SEGURO/.test(t))                     return 'armaz';
    if(/DISTRIBUI|MOVIMENTAC|FRETE|TRANSPORT|LOGISTIC/.test(t)) return 'logpecas';
    if(/REPARO/.test(t))                               return 'reparo';
    if(RX_TEL.test(t))                                 return 'tel';
    if(RX_LOC.test(t))                                 return 'locacao';
    return 'nao';
  }
  if(pilarK === 'invest'){
    if(/SISTEMA|SOFTWARE|LICENC/.test(t))              return 'sistema';
    if(RX_TEL.test(t))                                 return 'tel';
    if(RX_LOC.test(t))                                 return 'locacao';
    if(/COMPRA DE PECA|PECA|SPARE|EQUIPAMENT|FERRAMENT|NOTEBOOK|SERVIDOR|STORAGE/.test(t)) return 'spare';
    return 'nao';
  }
  return 'nao';
}

/* todas as linhas da MC, já classificadas e com a aba de origem */
function linhasClassificadas(mc){
  const out = [];
  PILARES.forEach(p=>{
    const blk = mc.blocos[p.k] || {};
    (blk.rows||[]).forEach((r,i)=>{
      out.push({...r, idx:i+1, pilarK:p.k, pilar:p.n, aba:blk.sheet||p.sheet,
                caixa:classificar(p.k, r), contrato:mc.contrato, mcId:mc.id, projeto:mc.projeto, cliente:mc.cliente});
    });
  });
  return out;
}

/* soma por caixinha */
function somaCaixas(mc){
  const s = {}; CAIXAS.forEach(c=>s[c.k]=0);
  linhasClassificadas(mc).forEach(l => s[l.caixa] += l.total);
  return s;
}

/* linha do Dashboard Gerencial montada a partir da MC */
function dashRow(mc){
  const meses = mc.mesesContrato || null;
  const caixas = somaCaixas(mc);
  return {
    id: mc.id, contrato: mc.contrato, projeto: mc.projeto, cliente: mc.cliente,
    produto: mc.produto||'', responsavel: mc.responsavel||'', comentarios: mc.comentarios||'',
    inicio: mc.inicio||'', fim: mc.fim||'', meses,
    vigencia: meses ? meses+' MESES' : '',
    total: mc.receita, mensal: meses ? mc.receita/meses : null,
    fat: meses ? (mc.receita/meses)/12 : null,
    tax: mc.impostoFator, imp: mc.impostos, net: mc.receitaLiq,
    costsTotais: mc.custo, costsMensais: meses ? mc.custo/meses : null,
    caixas, dm: mc.mcProjeto, dmPct: mc.mcProjetoPct,
    rateios: mc.rateioTot, mcDireta: mc.mcDireta, mcDiretaPct: mc.mcDiretaPct,
    arquivo: mc.arquivo, alerta: (mc.divergencias.length||mc.linhasForaDaConta.length)?1:0
  };
}

/* dados moram no backend agora — o painel é compartilhado pela equipe */
async function loadMCs(){
  try{
    const res=await fetch('/api/mcs',{credentials:'include'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    MCS=await res.json();
  }catch(e){
    MCS=[];
    showErr('Não consegui carregar as MCs do servidor. Tente recarregar a página.');
  }
}

/* ---------- ingestão ---------- */
function showErr(html){ el('errBox').innerHTML = html?`<div class="err">${html}</div>`:''; }
async function handleFiles(files){
  if(!files.length) return;
  showErr('');
  const fd=new FormData();
  for(const f of files) fd.append('files',f,f.name);
  try{
    const res=await fetch('/api/mcs/upload',{method:'POST',credentials:'include',body:fd});
    const data=await res.json();
    if(data.erros && data.erros.length)
      showErr(data.erros.map(e=>`<b>${esc(e.arquivo||'arquivo')}</b> — ${esc(e.mensagem||'erro ao processar')}`).join('<br>'));
    await loadMCs();
  }catch(e){
    showErr('Não consegui enviar os arquivos para o servidor. Tente novamente.');
  }
  render();
}

/* ---------- seleção ---------- */
function filtradas(){
  return MCS.filter(m=>{
    if(FILTRO.mc && m.id!==FILTRO.mc) return false;
    if(FILTRO.cliente && m.cliente!==FILTRO.cliente) return false;
    if(FILTRO.busca){
      const q=N(FILTRO.busca);
      if(!(N(m.projeto).includes(q)||N(m.contrato).includes(q)||N(m.cliente).includes(q))) return false;
    }
    return true;
  });
}
const rows = () => filtradas().map(dashRow);

/* escala: total do contrato ou valor mensal */
function sc(v,meses){
  if(v==null) return null;
  if(ESCALA==='mes') return meses ? v/meses : null;
  return v;
}
const sLbl = () => ESCALA==='mes' ? 'valores mensais' : 'total do contrato';

function totais(rs){
  const t=rs.reduce((a,r)=>({total:a.total+r.total,imp:a.imp+r.imp,net:a.net+r.net,
    costs:a.costs+r.costsTotais,dm:a.dm+r.dm,rateios:a.rateios+r.rateios,mcd:a.mcd+r.mcDireta}),
    {total:0,imp:0,net:0,costs:0,dm:0,rateios:0,mcd:0});
  t.dmPct=t.net?t.dm/t.net:null;
  t.mcdPct=t.net?t.mcd/t.net:null;
  t.caixas={}; CAIXAS.forEach(c=>t.caixas[c.k]=0);
  rs.forEach(r=>CAIXAS.forEach(c=>t.caixas[c.k]+=r.caixas[c.k]||0));
  return t;
}

/* ---------- ABA CAIXINHAS ---------- */
function viewCaixinhas(rs){
  const t=totais(rs);
  const tot=CAIXAS.reduce((a,c)=>a+t.caixas[c.k],0)||1;
  const um = rs.length===1?rs[0]:null;
  const val=k=> um ? sc(t.caixas[k],um.meses) : (ESCALA==='mes'
      ? rs.reduce((a,r)=>a+(r.meses?(r.caixas[k]||0)/r.meses:0),0) : t.caixas[k]);
  const ord=[...CAIXAS].sort((a,b)=>t.caixas[b.k]-t.caixas[a.k]);
  return `<div class="cx-grid">
    ${ord.map(c=>{
      const v=val(c.k), share=t.caixas[c.k]/tot;

        <div class="cx-t"><span class="cx-n">${c.n}</span><span class="cx-p">${pct(share)}</span></div>
        <div class="cx-v">${v==null?'—':money0(v)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(share*100).toFixed(1)}%;background:${CX_COLOR[c.k]}"></div></div>
        <div class="cx-s">${c.k==='nao'?'linhas sem caixinha definida':'coluna '+esc(c.col)} →</div>

    ${FILTRO.mc?'Filtrado em <b>uma MC</b> — vai abrir só as linhas dela.':'Sem MC selecionada — vai abrir o consolidado de todas, com quebra por contrato.'}</p>`;
}

/* ---------- DRILL-DOWN de uma caixinha ---------- */
function viewDrill(rs){
  const c=CAIXA_BY_K[DRILL];
  const mcs=filtradas();
  let linhas=[];
  mcs.forEach(mc=>linhas.push(...linhasClassificadas(mc).filter(l=>l.caixa===DRILL)));
  const tot=linhas.reduce((a,l)=>a+l.total,0);
  const soMC = mcs.length===1 ? mcs[0] : null;

  /* agrupamento por aba de origem */
  const porAba={};
  linhas.forEach(l=>{ porAba[l.aba]=porAba[l.aba]||{n:0,v:0,pilar:l.pilar}; porAba[l.aba].n++; porAba[l.aba].v+=l.total; });

  /* quebra por contrato quando é consolidado */
  const porMC={};
  linhas.forEach(l=>{ const k=l.contrato||l.projeto; porMC[k]=porMC[k]||{n:0,v:0,projeto:l.projeto,id:l.mcId}; porMC[k].n++; porMC[k].v+=l.total; });

  let h=`<button class="btn ghost sm" data-back="1" style="margin-bottom:16px">← Voltar para as caixinhas</button>
  <div class="sect-h" style="margin-bottom:16px">
    <div><h1 style="font-size:21px;display:flex;align-items:center;gap:10px">
      <span style="width:12px;height:12px;border-radius:4px;background:${CX_COLOR[DRILL]};display:inline-block"></span>${c.n}</h1>
      <p class="muted" style="font-size:13px;margin-top:4px">
        ${c.k==='nao'?'Linhas que não encaixaram em nenhuma caixinha — revisar o de-para'
          :`Coluna <b>${esc(c.col)}</b> do dashboard gerencial`}
        · ${linhas.length} linha${linhas.length>1?'s':''} · ${soMC?esc(soMC.contrato||soMC.projeto):`${mcs.length} MCs`}</p></div>
    <div class="sp"></div>
    <div style="text-align:right"><div class="lbl muted" style="font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase">Custo total</div>
      <div style="font-size:24px;font-weight:700;letter-spacing:-.8px">${money(tot)}</div></div>
  </div>`;

  if(!linhas.length) return h+`<div class="card"><div class="card-b muted">Nenhuma linha nesta caixinha para o filtro atual.</div></div>`;

  h+=`<div class="pilares" style="margin-bottom:16px">
    ${Object.entries(porAba).sort((a,b)=>b[1].v-a[1].v).map(([aba,v])=>`
      <div class="pilar" style="--c:${CX_COLOR[DRILL]}">
        <div class="tp"><div class="nm">${esc(aba)}</div><div class="pc">${pct(tot?v.v/tot:0)}</div></div>
        <div class="vl">${money0(v.v)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${tot?(v.v/tot*100).toFixed(1):0}%"></div></div>
        <div class="muted" style="font-size:11.5px;margin-top:8px">${v.n} linha(s) · ${esc(v.pilar)}</div>
      </div>`).join('')}
  </div>`;

  if(!soMC){
    h+=`<div class="card" style="margin-bottom:16px">
      <div class="card-h"><h3>Por contrato</h3><p>quanto cada MC contribui nesta caixinha</p></div>
      <div class="card-b flush"><div class="tbl-wrap"><table>
      <thead><tr><th>Contrato</th><th>Projeto</th><th class="num">Linhas</th><th class="num">Custo</th>
        <th class="num">% da caixinha</th><th style="width:150px"></th></tr></thead>
      <tbody>${Object.entries(porMC).sort((a,b)=>b[1].v-a[1].v).map(([k,v])=>`
        <tr class="clickable" data-open="${esc(v.id)}"><td class="mono"><b>${esc(k)}</b></td>
        <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.projeto)}</td>
        <td class="num mono">${v.n}</td><td class="num mono">${money(v.v)}</td>
        <td class="num mono">${pct(tot?v.v/tot:0)}</td>
        <td><div class="bar-track"><div class="bar-fill" style="width:${tot?(v.v/tot*100).toFixed(1):0}%;background:${CX_COLOR[DRILL]}"></div></div></td>
      </tr>`).join('')}</tbody></table></div></div></div>`;
  }

  h+=`<div class="card">
    <div class="card-h"><h3>Linhas da planilha</h3><p>cada linha com a aba de origem, exatamente como está na MC</p></div>
    <div class="card-b flush"><div class="tbl-wrap"><table>
    <thead><tr>${soMC?'':'<th>Contrato</th>'}<th>Aba de origem</th><th class="num">#</th>
      <th>Categoria</th><th>Descrição</th><th>Detalhe</th>
      <th class="num">Meses</th><th class="num">Qtde</th><th class="num">Vlr unit.</th>
      <th class="num">Custo final</th><th class="num">% da caixinha</th></tr></thead>
    <tbody>${linhas.sort((a,b)=>b.total-a.total).map(l=>`<tr>
      ${soMC?'':`<td class="mono">${esc(l.contrato||'—')}</td>`}
      <td><span class="aba">${esc(l.aba)}</span></td>
      <td class="num mono muted">${l.idx}</td>
      <td><b>${esc(l.cat)||'<span class="zero">—</span>'}</b></td>
      <td style="max-width:300px">${esc(l.desc)||'<span class="zero">—</span>'}</td>
      <td class="muted" style="font-size:12px;max-width:190px">${esc(l.extra)}</td>
      <td class="num mono ${l.meses?'':'zero'}">${l.hm?(l.meses?qty(l.meses):'0'):'—'}</td>
      <td class="num mono ${l.qtd?'':'zero'}">${qty(l.qtd)}</td>
      <td class="num mono ${l.unit?'':'zero'}">${money(l.unit)}</td>
      <td class="num mono ${l.total?'':'zero'}"><b>${money(l.total)}</b></td>
      <td class="num mono muted">${tot?pct(l.total/tot):'—'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="${soMC?8:9}">Total ${c.n}</td>
      <td class="num mono">${money(tot)}</td><td></td></tr></tfoot>
    </table></div></div></div>`;
  return h;
}

/* ---------- ABA MÉTRICAS ---------- */
function viewMetricas(rs){
  const t=totais(rs);
  const pil={}; PILARES.forEach(p=>pil[p.k]=0);
  filtradas().forEach(m=>PILARES.forEach(p=>pil[p.k]+=m.somas[p.k]||0));
  const totP=PILARES.reduce((a,p)=>a+pil[p.k],0)||1;
  const ord=[...rs].sort((a,b)=>(b.dmPct??-9)-(a.dmPct??-9));
  const vals=ord.map(r=>r.dmPct||0);
  const max=Math.max(...vals,0.01),min=Math.min(...vals,0),span=(max-min)||1;
  return `
  <div class="pilares" style="margin-bottom:16px">
    ${PILARES.map(p=>`<div class="pilar ${p.cls}">
      <div class="tp"><div class="nm">${p.n}</div><div class="pc">${pct(pil[p.k]/totP)}</div></div>
      <div class="vl">${money0(pil[p.k])}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(pil[p.k]/totP*100).toFixed(1)}%"></div></div>
    </div>`).join('')}
  </div>
  <div class="g2">
    <div class="card"><div class="card-h"><h3>Custo por pilar da MC</h3><p>as 4 abas de levantamento</p></div>
      <div class="card-b"><div class="chart-box"><canvas id="chPilar"></canvas></div></div></div>
    <div class="card"><div class="card-h"><h3>Ranking de margem</h3><p>DM %, do melhor para o pior — clique para abrir</p></div>
      <div class="card-b" style="max-height:300px;overflow-y:auto">
      ${ord.map((r,i)=>`<div class="rank-row" data-open="${esc(r.id)}">
        <div class="nm">${i+1}. ${esc(r.projeto)}<small>${esc(r.contrato||'—')} · ${esc(r.cliente)}</small></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,((r.dmPct-min)/span)*100)}%"></div></div>
        <div class="pc">${pct(r.dmPct)}</div></div>`).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Custo por caixinha do dashboard</h3><p>clique numa barra para abrir as linhas</p></div>
    <div class="card-b"><div class="chart-box" style="height:340px"><canvas id="chCaixas"></canvas></div></div></div>`;
}
let chP=null,chC=null;
const cFont=()=>({family:'Inter',size:11.5});
const cGrid=()=>getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
const cTx=()=>getComputedStyle(document.documentElement).getPropertyValue('--mut').trim();

function drawPilar(){
  const c=el('chPilar'); if(!c) return;

  chP=new Chart(c,{type:'doughnut',
    data:{labels:PILARES.map(p=>p.n),datasets:[{data:PILARES.map(p=>pil[p.k]),

        tooltip:{callbacks:{label:x=>{const s=x.dataset.data.reduce((a,b)=>a+b,0);

function drawCaixas(rs){
  const c=el('chCaixas'); if(!c) return;

  chC=new Chart(c,{type:'bar',
    data:{labels:ord.map(x=>x.n),datasets:[{label:'Custo',data:ord.map(x=>t.caixas[x.k]),
      backgroundColor:ord.map(x=>CX_COLOR[x.k]),borderRadius:6,borderSkipped:false}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      onClick:(e,a)=>{ if(a.length){ DRILL=ord[a[0].index].k; render(); } },
      plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>` ${money(x.raw)}`}}},
      scales:{x:{grid:{color:cGrid()},border:{display:false},ticks:{color:cTx(),font:cFont(),callback:v=>money0(v)}},
        y:{grid:{display:false},border:{display:false},ticks:{color:cTx(),font:cFont()}}}}});
}

/* ---------- ABA CLIENTES ---------- */
function viewClientes(rs){
  const by={};
  rs.forEach(r=>{ const k=r.cliente;
    by[k]=by[k]||{n:0,total:0,net:0,costs:0,dm:0,mcd:0};
    by[k].n++; by[k].total+=r.total; by[k].net+=r.net; by[k].costs+=r.costsTotais;
    by[k].dm+=r.dm; by[k].mcd+=r.mcDireta; });
  const ord=Object.entries(by).sort((a,b)=>b[1].total-a[1].total);
  const maxR=Math.max(...ord.map(([,v])=>v.total),1);
  return `<div class="card"><div class="card-h"><h3>Carteira por cliente</h3><p>receita e margem consolidadas</p></div>
    <div class="card-b flush"><div class="tbl-wrap"><table>

      <th class="num">Net revenue</th><th class="num">Costs</th><th class="num">DM</th>
      <th class="num">%</th><th class="num">MC direta %</th><th style="width:150px">Participação</th></tr></thead>
    <tbody>${ord.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="num mono">${v.n}</td>
      <td class="num mono">${money0(v.total)}</td><td class="num mono">${money0(v.net)}</td>
      <td class="num mono">${money0(v.costs)}</td><td class="num mono">${money0(v.dm)}</td>
      <td class="num mono"><b>${pct(v.net?v.dm/v.net:null)}</b></td>
      <td class="num mono">${pct(v.net?v.mcd/v.net:null)}</td>

}

      <div class="kpi c3"><div class="r1"><div class="ic">${svg(ICO.mc)}</div><span class="pill">após rateios</span></div>
        <div class="lbl">MC direta Faiston</div><div class="val">${pct(mc.mcDiretaPct)}</div><div class="sub">${money(mc.mcDireta)}</div></div>

        <div class="lbl">Total contrato</div><div class="val">${money0(mc.receita)}</div><div class="sub">net ${money0(mc.receitaLiq)}</div></div>

  PILARES.forEach(p=>h+=sub(p.n,mc.somas[p.k],pct(mc.somas[p.k]/rl)));
  h+=`${l('=','4. Margem de contribuição do projeto (DM)',mc.mcProjeto,pct(mc.mcProjetoPct),'result')}
      ${l('−','5. Rateios',mc.rateioTot,pct(mc.rateioTot/rl),'minus')}`;
  (mc.rateioVals||[]).forEach(r=>h+=sub(`${r.nome} (${pct2(r.p)})`,r.valor,pct(r.valor/rl)));
  h+=`${l('=','6. Margem de contribuição direta Faiston',mc.mcDireta,pct(mc.mcDiretaPct),'result2')}
    </div></div></div>
    <div><div class="card" style="margin-bottom:16px">
      <div class="card-h"><h3>Peso de cada pilar no custo</h3><p>as 4 abas de levantamento</p></div>
      <div class="card-b"><div class="pilares" style="grid-template-columns:1fr 1fr">`;
  PILARES.forEach(p=>{
    const v=mc.somas[p.k]||0;
    h+=`<div class="pilar ${p.cls}" style="box-shadow:none">
      <div class="tp"><div class="nm">${p.n}</div><div class="pc">${pct(v/ct)}</div></div>
      <div class="vl">${money0(v)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/ct*100).toFixed(1)}%"></div></div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">${mc.blocos[p.k].rows.length} linha(s)</div></div>`;
  });
  h+=`</div></div></div>`;
  if(mc.dre.found){
    const ok=!mc.divergencias.length;
    h+=`<div class="${ok?'ok-box':'err'}">${ok?'As linhas das abas 2.1 a 2.4 batem com o 5.DRE da planilha.'
      :`${mc.divergencias.length} pilar(es) divergem do 5.DRE — veja a aba Auditoria.`}</div>`;
  } else h+=`<div class="err">Esta planilha não tem a aba 5.DRE. Os números vieram das linhas, dos impostos e dos rateios.</div>`;
  h+=`</div></div>`;
  return h;
}

function tabPilar(mc,k){
  const p=PILARES.find(x=>x.k===k), rows=mc.blocos[k].rows||[];
  if(!rows.length) return `<div class="card"><div class="card-b muted">Nenhuma linha preenchida em <b>${p.n}</b> nesta MC.</div></div>`;
  const tot=rows.reduce((a,r)=>a+r.total,0);
  const byCat={}; rows.forEach(r=>{const c=r.cat||'(sem categoria)'; byCat[c]=(byCat[c]||0)+r.total;});
  return `<div class="muted" style="font-size:12.5px;margin-bottom:14px">Aba <b>${esc(mc.blocos[k].sheet||'')}</b> da planilha</div>
  <div class="pilares" style="margin-bottom:16px">
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
      <div class="pilar ${p.cls}"><div class="tp"><div class="nm">${esc(c)}</div><div class="pc">${pct(tot?v/tot:0)}</div></div>
      <div class="vl">${money0(v)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${tot?(v/tot*100).toFixed(1):0}%"></div></div></div>`).join('')}
  </div>
  <div class="card"><div class="card-b flush"><div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Caixinha</th><th>Categoria</th><th>Descrição</th><th>Detalhe</th>
      <th class="num">Meses</th><th class="num">Qtde</th><th class="num">Vlr unit.</th>
      <th class="num">Custo final</th><th class="num">% do pilar</th></tr></thead>
    <tbody>${rows.map((r,i)=>{const cx=classificar(k,r);return `<tr>
      <td class="mono muted">${i+1}</td>
      <td><span class="aba" data-gocaixa="${cx}" style="cursor:pointer;border-color:${CX_COLOR[cx]};color:${CX_COLOR[cx]}">${CAIXA_BY_K[cx].n}</span></td>
      <td><b>${esc(r.cat)||'<span class="zero">—</span>'}</b></td>
      <td style="max-width:300px">${esc(r.desc)||'<span class="zero">—</span>'}</td>
      <td class="muted" style="font-size:12px;max-width:200px">${esc(r.extra)}</td>
      <td class="num mono ${r.meses?'':'zero'}">${r.hm?(r.meses?qty(r.meses):'0'):'—'}</td>
      <td class="num mono ${r.qtd?'':'zero'}">${qty(r.qtd)}</td>
      <td class="num mono ${r.unit?'':'zero'}">${money(r.unit)}</td>
      <td class="num mono ${r.total?'':'zero'}"><b>${money(r.total)}</b></td>
      <td class="num mono muted">${tot?pct(r.total/tot):'—'}</td></tr>`}).join('')}</tbody>
    <tfoot><tr><td colspan="8">Total ${p.n}</td><td class="num mono">${money(tot)}</td><td></td></tr></tfoot>
  </table></div></div></div>`;
}

function tabAuditoria(mc){
  let h='';
  if(!mc.dre.found) h+=`<div class="err">Planilha sem aba 5.DRE — não dá para conferir as linhas contra o demonstrativo.</div>`;
  h+=`<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Soma das linhas × 5.DRE</h3><p>se divergir, alguém digitou por cima ou a fórmula quebrou</p></div>
    <div class="card-b flush"><div class="tbl-wrap"><table>
    <thead><tr><th>Pilar</th><th class="num">Soma das linhas</th><th class="num">5.DRE</th><th class="num">Diferença</th><th>Status</th></tr></thead>
    <tbody>${PILARES.map(p=>{
      const s=mc.somas[p.k]||0,d=mc.dre.found?mc.dre.pilar[p.k]:null,dif=d==null?null:s-d;
      return `<tr><td><b>${p.n}</b></td><td class="num mono">${money(s)}</td>
        <td class="num mono">${d==null?'—':money(d)}</td>
        <td class="num mono ${dif&&Math.abs(dif)>0.05?'delta-dn':''}">${dif==null?'—':money(dif)}</td>
        <td>${dif==null?'<span class="badge neutral">sem DRE</span>':(Math.abs(dif)<=0.05?'<span class="badge ok">bate</span>':'<span class="badge warn">diverge</span>')}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td>Custo total</td><td class="num mono">${money(mc.custoLinhas)}</td>
      <td class="num mono">${mc.custoDRE==null?'—':money(mc.custoDRE)}</td>
      <td class="num mono">${mc.custoDRE==null?'—':money(mc.custoLinhas-mc.custoDRE)}</td><td></td></tr></tfoot>
    </table></div></div></div>
  <div class="card">
    <div class="card-h"><h3>Linhas onde qtde × valor × meses ≠ custo final</h3><p>fórmula quebrada, célula travada ou valor digitado por cima</p></div>
    <div class="card-b${mc.linhasForaDaConta.length?' flush':''}">`;
  if(!mc.linhasForaDaConta.length)
    h+=`<div class="ok-box">Todas as ${PILARES.reduce((a,p)=>a+mc.blocos[p.k].rows.length,0)} linhas fecham com a própria fórmula.</div>`;
  else h+=`<div class="tbl-wrap"><table>
      <thead><tr><th>Pilar</th><th class="num">Linha</th><th>Descrição</th>
        <th class="num">Recalculado</th><th class="num">Na planilha</th><th class="num">Diferença</th></tr></thead>
      <tbody>${mc.linhasForaDaConta.map(r=>`<tr><td>${esc(r.pilar)}</td><td class="num mono">${r.idx}</td>
        <td>${esc(r.desc)||'—'}</td><td class="num mono">${money(r.calc)}</td>
        <td class="num mono">${money(r.total)}</td><td class="num mono delta-dn">${money(r.total-r.calc)}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`</div></div>`;
  return h;
}

/* ---------- simulador ---------- */
function tabSimulador(mc){
  if(!SIM||SIM.id!==mc.id){
    SIM={id:mc.id,receita:mc.receita,rows:{}};
    PILARES.forEach(p=>SIM.rows[p.k]=(mc.blocos[p.k].rows||[]).map(r=>({qtd:r.qtd,unit:r.unit,meses:r.meses,hm:r.hm})));
  }
  const s=simCalc(mc);
  const d=s.mcProjetoPct-mc.mcProjetoPct,dd=s.mcDiretaPct-mc.mcDiretaPct;
  const arr=x=>x>0.0001?'▲':(x<-0.0001?'▼':'=');
  const cls=x=>x>0.0001?'delta-up':(x<-0.0001?'delta-dn':'muted');
  let h=`<div class="sim-note">Mexa em quantidade, valor unitário, meses ou na receita bruta e a margem recalcula na hora.
    <b>Nada disso altera a planilha original nem o que está salvo no painel</b> — é só cenário.</div>
  <div class="kpis">
    <div class="kpi hi"><div class="r1"><div class="ic">${svg(ICO.pct)}</div>
      <span class="pill ${d>0.0001?'g':(d<-0.0001?'y':'n')}">${arr(d)} ${pct(Math.abs(d))}</span></div>
      <div class="lbl">DM % simulada</div><div class="val">${pct(s.mcProjetoPct)}</div><div class="sub">original ${pct(mc.mcProjetoPct)}</div></div>
    <div class="kpi c3"><div class="r1"><div class="ic">${svg(ICO.mc)}</div>
      <span class="pill ${dd>0.0001?'g':(dd<-0.0001?'y':'n')}">${arr(dd)} ${pct(Math.abs(dd))}</span></div>
      <div class="lbl">MC direta simulada</div><div class="val">${pct(s.mcDiretaPct)}</div><div class="sub">original ${pct(mc.mcDiretaPct)}</div></div>
    <div class="kpi c2"><div class="r1"><div class="ic">${svg(ICO.chart)}</div>
      <span class="pill n">${s.custo-mc.custo>=0?'+':''}${money0(s.custo-mc.custo)}</span></div>
      <div class="lbl">Costs simulados</div><div class="val">${money0(s.custo)}</div><div class="sub">original ${money0(mc.custo)}</div></div>
    <div class="kpi"><div class="r1"><div class="ic">${svg(ICO.cash)}</div>
      <span class="pill n">${s.mcProjeto-mc.mcProjeto>=0?'+':''}${money0(s.mcProjeto-mc.mcProjeto)}</span></div>
      <div class="lbl">DM em R$</div><div class="val">${money0(s.mcProjeto)}</div><div class="sub">original ${money0(mc.mcProjeto)}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-b"><div class="filters" style="margin:0">
    <div><div style="font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px" class="muted">Receita bruta</div>
      <input type="number" id="simReceita" value="${SIM.receita}" step="1000" style="width:180px"></div>
    <div style="align-self:flex-end"><button class="btn ghost sm" id="simReset">Restaurar originais</button></div>
    <div style="align-self:flex-end" class="muted">Impostos ${pct2(mc.impostoFator)} · rateios ${pct2((mc.rateios||[]).reduce((a,r)=>a+r.p,0))} — fixos, vêm da planilha</div>
  </div></div></div>`;
  PILARES.forEach(p=>{
    const rows=mc.blocos[p.k].rows||[]; if(!rows.length) return;
    const sr=SIM.rows[p.k], tot=sr.reduce((a,r)=>a+lineCost(r),0), orig=mc.somas[p.k];
    h+=`<div class="card" style="margin-bottom:16px">
      <div class="card-h" style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <div><h3>${p.n}</h3></div><div style="flex:1"></div>
        <div class="mono" style="font-weight:600">${money(tot)} <span class="${cls(orig-tot)}">(${tot-orig>=0?'+':''}${money0(tot-orig)})</span></div></div>
      <div class="card-b flush"><div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Categoria</th><th>Descrição</th><th class="num">Qtde</th>
        <th class="num">Vlr unit.</th><th class="num">Meses</th><th class="num">Custo</th><th class="num">vs. original</th></tr></thead>
      <tbody>${rows.map((r,i)=>{
        const v=sr[i],cur=lineCost(v);
        const dirty=(v.qtd!==r.qtd||v.unit!==r.unit||v.meses!==r.meses)?' dirty':'';
        return `<tr><td class="mono muted">${i+1}</td><td>${esc(r.cat)||'—'}</td>
          <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.desc)||'—'}</td>
          <td class="num"><input class="simin${dirty}" type="number" step="0.01" value="${v.qtd}" data-p="${p.k}" data-i="${i}" data-f="qtd"></td>
          <td class="num"><input class="simin${dirty}" type="number" step="0.01" value="${v.unit}" data-p="${p.k}" data-i="${i}" data-f="unit"></td>
          <td class="num">${v.hm?`<input class="simin${dirty}" type="number" step="1" value="${v.meses}" data-p="${p.k}" data-i="${i}" data-f="meses">`:'<span class="zero">—</span>'}</td>
          <td class="num mono"><b>${money(cur)}</b></td>
          <td class="num mono ${cls(r.total-cur)}">${cur-r.total===0?'—':(cur-r.total>0?'+':'')+money0(cur-r.total)}</td></tr>`;
      }).join('')}</tbody></table></div></div></div>`;
  });
  return h;
}
function simCalc(mc){
  const somas={}; PILARES.forEach(p=>somas[p.k]=(SIM.rows[p.k]||[]).reduce((a,r)=>a+lineCost(r),0));
  return calcDRE(SIM.receita,somas,mc.impostoFator,mc.rateios);
}
function bindSim(mc){
  el('simReceita').oninput=e=>{ SIM.receita=num(e.target.value); redrawSim(mc,e.target); };
  el('simReset').onclick=()=>{ SIM=null; renderDetalhe(mc,'sim'); };
  document.querySelectorAll('input.simin').forEach(inp=>inp.oninput=e=>{
    const {p,i,f}=e.target.dataset; SIM.rows[p][+i][f]=num(e.target.value); redrawSim(mc,e.target); });
}
let simTimer=null;
function redrawSim(mc,focusEl){
  clearTimeout(simTimer);
  simTimer=setTimeout(()=>{
    const isRec=focusEl&&focusEl.id==='simReceita';
    const key=(focusEl&&focusEl.dataset&&focusEl.dataset.p)?`${focusEl.dataset.p}|${focusEl.dataset.i}|${focusEl.dataset.f}`:null;
    const pos=focusEl?focusEl.selectionStart:null;
    el('dBody').innerHTML=tabSimulador(mc); bindSim(mc);
    let back=null;
    if(isRec) back=el('simReceita');
    else if(key){ const [p,i,f]=key.split('|');
      back=document.querySelector(`input.simin[data-p="${p}"][data-i="${i}"][data-f="${f}"]`); }
    if(back){ back.focus(); try{back.setSelectionRange(pos,pos);}catch(e){} }
  },250);
}

/* ============================================================
   EXPORT / TEMA / BOOT
   ============================================================ */
function exportCSV(){
  const rs=rows();
  const head=['ID','Contrato','Cliente','Responsavel','Produto','Inicio','Fim','Vigencia (meses)',
    'Total contrato','Valor mensal','% FAT','TAX','IMP','Net revenue','Costs totais','Costs mensais',
    ...CAIXAS.map(c=>c.col==='—'?'Nao mapeado':c.col),
    'DM','%','Rateios','MC direta','MC direta %','Arquivo'];
  const f=v=>v==null?'':String(v.toFixed(2)).replace('.',',');
  const lines=[head.join(';')];
  rs.forEach(r=>lines.push([r.contrato,r.projeto,r.cliente,r.responsavel,r.produto,r.inicio,r.fim,r.meses||'',
    f(r.total),f(r.mensal),f(r.fat),f(r.tax),f(r.imp),f(r.net),f(r.costsTotais),f(r.costsMensais),
    ...CAIXAS.map(c=>f(r.caixas[c.k])),
    f(r.dm),f((r.dmPct||0)*100),f(r.rateios),f(r.mcDireta),f((r.mcDiretaPct||0)*100),r.arquivo]
    .map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(';')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='dashboard-gerencial-mc.csv'; a.click();
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('faiston_mc_theme',t); }catch(e){}
  if(TAB==='metricas'&&!DRILL&&MCS.length){ const rs=rows(); drawPilar(rs); drawCaixas(rs); }
}

el('btnAdd').onclick=()=>el('fileInput').click();
el('drop').onclick=()=>el('fileInput').click();
el('fileInput').onchange=e=>{ handleFiles([...e.target.files]); e.target.value=''; };
el('btnExport').onclick=exportCSV;
el('btnClear').onclick=async ()=>{ if(MCS.length&&confirm('Remover todas as MCs do painel? Isso apaga para toda a equipe. Os arquivos originais não são afetados.')){
  try{ await fetch('/api/mcs/clear',{method:'POST',credentials:'include'}); }catch(e){}
  showErr(''); DRILL=null; await loadMCs(); voltar(); render(); } };
el('btnTheme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
el('fBusca').oninput=e=>{ FILTRO.busca=e.target.value; render(); };
el('fCliente').onchange=e=>{ FILTRO.cliente=e.target.value; FILTRO.mc=''; render(); };
el('fMC').onchange=e=>{ FILTRO.mc=e.target.value; render(); };

['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault(); const d=el('drop'); if(d) d.classList.add('over'); }));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault(); const d=el('drop'); if(d) d.classList.remove('over'); }));
document.addEventListener('drop',e=>{ const fs=[...(e.dataTransfer?.files||[])]; if(fs.length) handleFiles(fs); });

(async function init(){
  try{ const t=localStorage.getItem('faiston_mc_theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
  await loadMCs();
  render();
})();

</script>
